name: 🗄️ Database Backup

# ──────────────────────────────────────────────────────────────
# pg_dump diario de la base de datos Supabase, subido como
# artefacto de GitHub (retención: 90 días).
#
# El workflow FALLA de forma visible si el volcado no contiene
# datos reales. La versión anterior encadenaba `pg_dump | gzip`,
# de modo que el código de salida era el de gzip y un fallo de
# conexión producía un archivo vacío con el job en verde: meses
# de backups inservibles sin un solo aviso. Ahora se vuelca a
# fichero, se comprueba `PIPESTATUS`, y se verifica que el dump
# trae las tablas y los datos esperados antes de publicarlo.
#
# SECRETS NECESARIOS (GitHub → Settings → Secrets and variables
# → Actions → New repository secret):
#
#   SUPABASE_DB_HOST      Host del Session Pooler. IMPORTANTE:
#                         la conexión directa (db.<ref>.supabase.co)
#                         solo resuelve por IPv6 y los runners de
#                         GitHub no tienen IPv6, así que hay que
#                         usar el pooler, que sí da IPv4.
#                         Ej.: aws-0-eu-central-1.pooler.supabase.com
#   SUPABASE_DB_USER      Usuario del pooler, con el ref del
#                         proyecto. Ej.: postgres.ptylfsashyeivxvutdtg
#   SUPABASE_DB_PASSWORD  Contraseña de la base de datos.
#
# Los tres valores salen de:
#   Supabase Dashboard → Settings → Database → Connection string
#   → pestaña "Session pooler"
# ──────────────────────────────────────────────────────────────

on:
  schedule:
    # Cada día a las 02:00 UTC (04:00 hora peninsular en verano)
    - cron: "0 2 * * *"

  # Permite lanzarlo a mano desde
  # GitHub → Actions → Database Backup → Run workflow
  workflow_dispatch:

jobs:
  backup:
    name: pg_dump → Artifact
    runs-on: ubuntu-latest

    steps:
      # ── 1. Comprobar que los secrets existen ────────────────
      #    Sin esto, unos secrets ausentes se expanden a cadena
      #    vacía y el fallo aparece mucho más abajo y disfrazado.
      - name: Verificar configuración
        env:
          DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          DB_USER: ${{ secrets.SUPABASE_DB_USER }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          faltan=""
          [ -z "${DB_HOST}" ]     && faltan="${faltan} SUPABASE_DB_HOST"
          [ -z "${DB_USER}" ]     && faltan="${faltan} SUPABASE_DB_USER"
          [ -z "${DB_PASSWORD}" ] && faltan="${faltan} SUPABASE_DB_PASSWORD"
          if [ -n "${faltan}" ]; then
            echo "::error::Faltan secrets:${faltan}. Configúralos en Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "✅ Secrets presentes. Host: ${DB_HOST}"

      # ── 2. Cliente PostgreSQL 17 ────────────────────────────
      #    El paquete de Ubuntu va por detrás de la versión del
      #    servidor, y pg_dump se niega a volcar de un servidor
      #    más nuevo que él. Se instala desde el repo oficial.
      - name: Instalar postgresql-client 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      # ── 3. Volcado ──────────────────────────────────────────
      - name: Ejecutar pg_dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "30"
        run: |
          set -euo pipefail

          TIMESTAMP=$(date -u +%Y-%m-%d_%H-%M-%S)
          FILENAME="backup_${TIMESTAMP}.sql"

          # Sin pipe: así un fallo de pg_dump aborta el job de verdad.
          volcar() {
            pg_dump \
              --host="${{ secrets.SUPABASE_DB_HOST }}" \
              --port=5432 \
              --username="${{ secrets.SUPABASE_DB_USER }}" \
              --dbname=postgres \
              --no-owner \
              --no-acl \
              --file="${FILENAME}" \
              "$@"
          }

          # Se intenta incluir el schema auth, para poder restaurar
          # también los usuarios: sin él, un restore desde cero deja la
          # app sin nadie que pueda entrar. Si el rol no tiene permiso
          # para leerlo, se repite sin auth en lugar de perder el
          # backup entero — los datos de negocio son lo prioritario.
          if volcar --schema=public --schema=dev --schema=auth; then
            echo "AUTH_INCLUIDO=sí" >> "$GITHUB_ENV"
          else
            echo "::warning::No se pudo volcar el schema auth (permisos). Se continúa con public y dev."
            volcar --schema=public --schema=dev
            echo "AUTH_INCLUIDO=no" >> "$GITHUB_ENV"
          fi

          echo "TIMESTAMP=${TIMESTAMP}" >> "$GITHUB_ENV"
          echo "FILENAME=${FILENAME}.gz" >> "$GITHUB_ENV"

      # ── 4. Verificar que el volcado sirve ───────────────────
      #    Un backup que no se comprueba no es un backup: es un
      #    archivo. Se exige tamaño mínimo, las tablas críticas y
      #    sentencias COPY con datos.
      - name: Verificar contenido
        run: |
          set -euo pipefail
          ARCHIVO="backup_${TIMESTAMP}.sql"

          BYTES=$(stat -c%s "${ARCHIVO}")
          echo "Tamaño del volcado: ${BYTES} bytes"
          if [ "${BYTES}" -lt 51200 ]; then
            echo "::error::El volcado ocupa solo ${BYTES} bytes. Se esperaba un dump completo; algo ha fallado."
            exit 1
          fi

          faltan=""
          for tabla in puestas_a_disposicion salidas_parciales inbound_movements outbound_movements warehouses products customers; do
            grep -q "CREATE TABLE public.${tabla}" "${ARCHIVO}" || faltan="${faltan} ${tabla}"
          done
          if [ -n "${faltan}" ]; then
            echo "::error::Faltan tablas en el volcado:${faltan}"
            exit 1
          fi

          COPIAS=$(grep -c "^COPY public\." "${ARCHIVO}" || true)
          echo "Bloques COPY de datos: ${COPIAS}"
          if [ "${COPIAS}" -lt 5 ]; then
            echo "::error::El volcado tiene estructura pero apenas datos (${COPIAS} bloques COPY)."
            exit 1
          fi

          gzip -9 "${ARCHIVO}"
          SIZE=$(du -sh "${ARCHIVO}.gz" | cut -f1)
          echo "BACKUP_SIZE=${SIZE}"   >> "$GITHUB_ENV"
          echo "BACKUP_TABLAS=${COPIAS}" >> "$GITHUB_ENV"
          echo "✅ Volcado verificado: ${ARCHIVO}.gz (${SIZE})"

      # ── 5. Publicar ─────────────────────────────────────────
      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: "db-backup-${{ env.TIMESTAMP }}"
          path: "${{ env.FILENAME }}"
          retention-days: 90
          if-no-files-found: error

      # ── 6. Resumen ──────────────────────────────────────────
      - name: Resumen
        if: always()
        run: |
          {
            echo "### 🗄️ Backup de base de datos"
            echo "| Campo | Valor |"
            echo "|-------|-------|"
            echo "| Resultado | ${{ job.status }} |"
            echo "| Fecha | ${TIMESTAMP:-—} UTC |"
            echo "| Archivo | ${FILENAME:-—} |"
            echo "| Tamaño | ${BACKUP_SIZE:-—} |"
            echo "| Bloques de datos | ${BACKUP_TABLAS:-—} |"
            echo "| Retención | 90 días |"
            echo "| Schemas | public + dev (auth: ${AUTH_INCLUIDO:-—}) |"
          } >> "$GITHUB_STEP_SUMMARY"
